<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Draftea coin-flip — test client</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: ui-monospace, Menlo, Consolas, monospace; margin: 0; padding: 16px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    label { font-size: 0.85em; opacity: 0.8; }
    input, select, button { font-family: inherit; padding: 4px 8px; }
    input[type="text"] { min-width: 320px; }
    #log { border: 1px solid #888; background: #111; color: #eee; padding: 8px; height: 55vh; overflow-y: auto; white-space: pre-wrap; word-break: break-word; font-size: 0.8em; }
    .in { color: #7ec8ff; }
    .out { color: #9be89b; }
    .sys { color: #ffd479; }
  </style>
</head>
<body>
  <h1>coin-flip test client</h1>

  <div class="row">
    <input id="url" type="text" value="ws://localhost:8080/games/coinflip?userId=test" />
    <button id="connect">Connect</button>
  </div>

  <div class="row">
    <label>clientVersion</label><input id="clientVersion" type="text" value="browser" />
    <button id="hello" data-msg="hello" disabled>hello</button>
    <button id="get_balance" data-msg="get_balance" disabled>get_balance</button>
    <button id="get_open_round" data-msg="get_open_round" disabled>get_open_round</button>
    <button id="ping" data-msg="ping" disabled>ping</button>
  </div>

  <div class="row">
    <label>bet</label><input id="bet" type="number" value="10" min="1" max="5000" />
    <button id="get_quote" disabled>get_quote</button>
    <label>pick</label><select id="pick"><option>heads</option><option>tails</option></select>
    <label>quoteId</label><input id="quoteId" type="text" />
    <button id="place_round" disabled>place_round</button>
  </div>

  <div class="row">
    <label>roundId</label><input id="roundId" type="text" />
    <button id="ack_round" disabled>ack_round</button>
  </div>

  <div class="row">
    <button id="drop" disabled>Drop socket</button>
    <button id="reconnect" disabled>Reconnect with session</button>
  </div>

  <div id="log"></div>

  <script>
    let ws = null;
    let reqSeq = 0;
    let lastSessionId = null;
    let connected = false;

    const $ = (id) => document.getElementById(id);

    function log(text, cls) {
      const el = $('log');
      const line = document.createElement('div');
      if (cls) line.className = cls;
      line.textContent = text;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    }

    function setButtons(enabled) {
      for (const id of ['hello', 'get_balance', 'get_open_round', 'ping', 'get_quote', 'place_round', 'ack_round', 'drop', 'reconnect']) {
        $(id).disabled = !enabled;
      }
    }

    function send(type, body) {
      const reqId = 'c' + (++reqSeq);
      const msg = Object.assign({ reqId: reqId, type: type }, body || {});
      ws.send(JSON.stringify(msg));
      log('→ ' + JSON.stringify(msg), 'out');
      return reqId;
    }

    function wire(open) {
      ws.onopen = () => { connected = true; setButtons(true); log('connected', 'sys'); };
      ws.onmessage = (ev) => {
        let obj;
        try { obj = JSON.parse(ev.data); } catch { obj = { raw: ev.data }; }
        if (obj.type === 'welcome' && obj.sessionId) lastSessionId = obj.sessionId;
        log('← ' + JSON.stringify(obj), 'in');
      };
      ws.onclose = (ev) => {
        connected = false;
        setButtons(false);
        log('closed code=' + ev.code + ' reason=' + (ev.reason || ''), 'sys');
      };
      ws.onerror = () => log('socket error', 'sys');
      if (open !== false) { /* nothing */ }
    }

    function connect() {
      ws = new WebSocket($('url').value);
      wire(true);
    }

    function reconnect() {
      let url = $('url').value;
      if (lastSessionId) {
        const sep = url.indexOf('?') === -1 ? '?' : '&';
        url = url + sep + 'sessionId=' + lastSessionId;
        $('url').value = url;
      }
      ws = new WebSocket(url);
      wire(true);
    }

    $('connect').onclick = connect;
    $('drop').onclick = () => ws.close();
    $('reconnect').onclick = reconnect;

    $('hello').onclick = () => send('hello', { clientVersion: $('clientVersion').value });
    $('get_balance').onclick = () => send('get_balance');
    $('get_open_round').onclick = () => send('get_open_round');
    $('ping').onclick = () => send('ping');
    $('get_quote').onclick = () => send('get_quote', { bet: Number($('bet').value) });
    $('place_round').onclick = () => send('place_round', { bet: Number($('bet').value), pick: $('pick').value, quoteId: $('quoteId').value });
    $('ack_round').onclick = () => send('ack_round', { roundId: $('roundId').value });
  </script>
</body>
</html>
